name: 🐧 OpenMP

on:
  push:
    branches:
      - "development"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-ubuntu
  cancel-in-progress: true

jobs:

  check_changes:
    name: Analyze
    uses: ./.github/workflows/check_changes.yml

  build_cxxminimal:
    name: GCC Minimal w/o MPI
    runs-on: ubuntu-24.04
    needs: check_changes
    if: ${{ github.event.pull_request.draft == false && needs.check_changes.outputs.has_non_docs_changes == 'true' }}
    env:
      CXXFLAGS: "-Werror"
    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: |
        .github/workflows/dependencies/gcc.sh
    - name: CCache Cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: build WarpX
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=100M
        ccache -z

        cmake -S . -B build            \
          -DCMAKE_VERBOSE_MAKEFILE=ON  \
          -DWarpX_DIMS="RZ"          \
          -DWarpX_EB=OFF               \
          -DWarpX_MPI=OFF              \
          -DWarpX_QED=OFF
        cmake --build build -j 4
        ./build/bin/warpx.rz Examples/Physics_applications/laser_acceleration/inputs_base_rz

        ccache -s
        du -hs ~/.cache/ccache

  build_1D:
    name: GCC 1D w/ MPI, QED tools
    runs-on: ubuntu-24.04
    needs: check_changes
    if: ${{ github.event.pull_request.draft == false && needs.check_changes.outputs.has_non_docs_changes == 'true' }}
    env:
      CXXFLAGS: "-Werror"
      CXX: "g++-12"
      CC: "gcc-12"
    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: |
        .github/workflows/dependencies/gcc12.sh
    - name: CCache Cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: build WarpX
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=100M
        ccache -z

        cmake -S . -B build            \
          -GNinja                      \
          -DCMAKE_VERBOSE_MAKEFILE=ON  \
          -DWarpX_DIMS="1"           \
          -DWarpX_EB=OFF               \
          -DWarpX_FFT=ON               \
          -DWarpX_QED_TABLE_GEN=ON     \
          -DWarpX_QED_TOOLS=ON

        cmake --build build -j 4
        ./build/bin/warpx.1d Examples/Physics_applications/laser_acceleration/inputs_base_1d

        ccache -s
        du -hs ~/.cache/ccache

    - name: run QED table tools
      run: |
        .github/workflows/scripts/checkQEDTableGenerator.sh

  build_sp:
    name: GCC RZ w/ MPI, single precision
    runs-on: ubuntu-22.04
    needs: check_changes
    if: ${{ github.event.pull_request.draft == false && needs.check_changes.outputs.has_non_docs_changes == 'true' }}
    env:
      CXX: "g++-12"
      CC: "gcc-12"
    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: |
        .github/workflows/dependencies/gcc12_blaspp_lapackpp.sh
    - name: CCache Cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: build WarpX
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=200M
        ccache -z

        # we need to define this *after* having installed the dependencies,
        # because the compilation of blaspp raises warnings.
        export CXXFLAGS="-Werror"

        cmake -S . -B build                 \
          -GNinja                           \
          -DCMAKE_VERBOSE_MAKEFILE=ON       \
          -DWarpX_DIMS="RZ"               \
          -DWarpX_EB=OFF                    \
          -DWarpX_FFT=ON                    \
          -DWarpX_PRECISION=SINGLE          \
          -DWarpX_PARTICLE_PRECISION=SINGLE \
          -DWarpX_QED_TABLE_GEN=ON

        cmake --build build -j 4
        ./build/bin/warpx.rz Examples/Physics_applications/laser_acceleration/inputs_base_rz

        ccache -s
        du -hs ~/.cache/ccache

  build_gcc_ablastr:
    name: GCC ABLASTR w/o MPI
    runs-on: ubuntu-24.04
    needs: check_changes
    if: ${{ github.event.pull_request.draft == false && needs.check_changes.outputs.has_non_docs_changes == 'true' }}
    env:
      CMAKE_GENERATOR: Ninja
      CXXFLAGS: "-Werror"
    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: |
        .github/workflows/dependencies/gcc.sh
        sudo apt-get install -y libopenmpi-dev openmpi-bin
    - name: CCache Cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: build WarpX
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=100M
        ccache -z

        cmake -S . -B build            \
          -DCMAKE_VERBOSE_MAKEFILE=ON  \
          -DWarpX_APP=OFF              \
          -DWarpX_LIB=OFF
        cmake --build build -j 4

        ccache -s
        du -hs ~/.cache/ccache
